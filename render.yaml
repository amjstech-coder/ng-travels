services:
  - type: web
    name: ng-travels-api
    runtime: node
    plan: free
    buildCommand: corepack enable && pnpm install --no-frozen-lockfile && pnpm --filter @workspace/api-server run build
    startCommand: node --enable-source-maps artifacts/api-server/dist/index.mjs
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: PORT
        value: 10000
      # Set these in the Render dashboard (copy from your old Vercel project):
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: CRON_SECRET
        sync: false

  # Replaces the Vercel cron: daily at 03:00 UTC, calls the API cleanup endpoint.
  - type: cron
    name: ng-travels-cleanup-trip-images
    runtime: node
    schedule: "0 3 * * *"
    buildCommand: echo skip
    startCommand: curl -fsS -H "Authorization: Bearer $CRON_SECRET" https://ng-travels-api.onrender.com/api/cron/cleanup-trip-images
    envVars:
      - key: CRON_SECRET
        sync: false
